name: Apply 5131 pre-conversation controller state

on:
  push:
    branches:
      - fix/5131-preconversation-controller-state

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5131-preconversation-controller-state
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Separate startup-without-conversation from a stopped controller
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("backend/internal/service/chat/service.go")
          source = path.read_text()

          anchor = '''func idleControllerState(record domain.SessionRecord) ports.ChatControllerState {
          \tif record.IsTerminated {
          \t\treturn ports.ChatControllerStopped
          \t}
          \tif record.ProvisionState.IsProvisioning() {
          \t\treturn ports.ChatControllerConnecting
          \t}
          \tif record.HibernatedAt != nil {
          \t\treturn ports.ChatControllerHibernated
          \t}
          \treturn ports.ChatControllerStopped
          }'''
          replacement = anchor + '''

          // preConversationControllerState reports the durable startup fact before
          // the controller creates its first conversation row. Nothing has stopped
          // in this state. Preserve explicit terminal facts and the newer hibernation
          // state rather than hiding them behind a startup grace period.
          func preConversationControllerState(record domain.SessionRecord) ports.ChatControllerState {
          \tif record.IsTerminated || record.Activity.State == domain.ActivityExited {
          \t\treturn ports.ChatControllerStopped
          \t}
          \tif record.HibernatedAt != nil {
          \t\treturn ports.ChatControllerHibernated
          \t}
          \treturn ports.ChatControllerConnecting
          }'''
          if source.count(anchor) != 1:
              raise SystemExit("idle controller helper anchor did not match exactly once")
          source = source.replace(anchor, replacement)

          old = '''\t\t\tController: idleControllerState(record),'''
          new = '''\t\t\tController: preConversationControllerState(record),'''
          if source.count(old) != 2:
              raise SystemExit(f"pre-conversation snapshot anchor count={source.count(old)}, want 2")
          source = source.replace(old, new)

          path.write_text(source)
          Path(".github/workflows/apply-5131-preconversation-state.yml").unlink()
          PY
          gofmt -w backend/internal/service/chat/service.go backend/internal/service/chat/startup_controller_state_test.go
      - name: Run focused and package regressions
        working-directory: backend
        run: |
          go test ./internal/service/chat -run 'TestPreConversationControllerStateDescribesAControllerThatHasNotStarted|TestExistingConversationWithoutControllerStillReportsStopped'
          go test ./internal/service/chat -count=1
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/service/chat/service.go backend/internal/service/chat/startup_controller_state_test.go .github/workflows/apply-5131-preconversation-state.yml
          git commit -m "fix(chat): report pre-conversation startup as connecting"
          git push origin HEAD:fix/5131-preconversation-controller-state
