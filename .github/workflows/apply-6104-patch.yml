name: Apply 6104 lifecycle patch

on:
  push:
    branches:
      - fix/6104-rearm-conflict-after-provider-mergeable-blocked

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/6104-rearm-conflict-after-provider-mergeable-blocked
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Apply narrow provider re-arm fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("backend/internal/lifecycle/reactions.go")
          source = path.read_text()

          helper_anchor = '''func mergeabilityClearsConflict(state domain.Mergeability) bool {
          \treturn state == domain.MergeMergeable || state == domain.MergeUnstable
          }'''
          helper_replacement = helper_anchor + '''

          // providerMergeabilityClearsConflict preserves a positive provider
          // mergeability fact that AO's normalized state can intentionally obscure.
          // GitHub reports mergeable=MERGEABLE with mergeStateStatus=BLOCKED when
          // the head is conflict-free but a required review still blocks merging.
          // That combination must re-arm the conflict nudge without treating the PR
          // as ready to merge. A contradictory DIRTY/CONFLICTING provider state is
          // never accepted as proof that the conflict cleared.
          func providerMergeabilityClearsConflict(o ports.SCMObservation) bool {
          \tif !strings.EqualFold(strings.TrimSpace(o.PR.ProviderMergeable), "MERGEABLE") {
          \t\treturn false
          \t}
          \tswitch strings.ToUpper(strings.TrimSpace(o.PR.ProviderMergeStateStatus)) {
          \tcase "DIRTY", "CONFLICTING":
          \t\treturn false
          \tdefault:
          \t\treturn true
          \t}
          }'''
          if source.count(helper_anchor) != 1:
              raise SystemExit("mergeability helper anchor did not match exactly once")
          source = source.replace(helper_anchor, helper_replacement)

          apply_anchor = '''func (m *Manager) ApplySCMObservation(ctx context.Context, id domain.SessionID, o ports.SCMObservation) error {
          \tif !o.Fetched {
          \t\treturn nil
          \t}
          \tif err := m.ApplyPRObservation(ctx, id, scmToPRObservation(o)); err != nil {
          \t\treturn err
          \t}
          \tready, err := m.scmObservationReadyToMerge(ctx, o)'''
          apply_replacement = '''func (m *Manager) ApplySCMObservation(ctx context.Context, id domain.SessionID, o ports.SCMObservation) error {
          \tif !o.Fetched {
          \t\treturn nil
          \t}
          \t// The compatibility PR observation carries AO's normalized mergeability,
          \t// which may be blocked for review even when the provider positively says
          \t// the head is conflict-free. Re-arm from that raw fact before projection;
          \t// keep any persistence error deferred so independent reactions still run.
          \tvar providerRearmErr error
          \tif !mergeabilityClearsConflict(domain.Mergeability(o.Mergeability.State)) && providerMergeabilityClearsConflict(o) {
          \t\tproviderRearmErr = m.rearmMergeConflict(ctx, firstSCMNonEmpty(o.PR.URL, o.PR.HTMLURL))
          \t}
          \tif err := m.ApplyPRObservation(ctx, id, scmToPRObservation(o)); err != nil {
          \t\treturn err
          \t}
          \tif providerRearmErr != nil {
          \t\treturn providerRearmErr
          \t}
          \tready, err := m.scmObservationReadyToMerge(ctx, o)'''
          if source.count(apply_anchor) != 1:
              raise SystemExit("ApplySCMObservation anchor did not match exactly once")
          source = source.replace(apply_anchor, apply_replacement)
          path.write_text(source)

          Path(".github/workflows/apply-6104-patch.yml").unlink()
          PY
          gofmt -w backend/internal/lifecycle/reactions.go backend/internal/lifecycle/merge_conflict_provider_rearm_test.go
      - name: Run focused lifecycle tests
        working-directory: backend
        run: go test ./internal/lifecycle -run 'MergeConflict|ProviderMergeable|ProviderMergeability'
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/lifecycle/reactions.go backend/internal/lifecycle/merge_conflict_provider_rearm_test.go .github/workflows/apply-6104-patch.yml
          git commit -m "fix(lifecycle): rearm conflicts after provider-confirmed clean head"
          git push origin HEAD:fix/6104-rearm-conflict-after-provider-mergeable-blocked
