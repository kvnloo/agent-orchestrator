name: Apply 5370 send diagnostics

on:
  push:
    branches:
      - fix/5370-send-failure-session-diagnostics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5370-send-failure-session-diagnostics
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Add bounded session context to failed send telemetry
        run: |
          python3 <<'PY'
          from pathlib import Path

          envelope = Path("backend/internal/httpd/envelope/envelope.go")
          source = envelope.read_text()
          old = '''var safeTelemetryFields = map[string]struct{}{
          \t"browser_command":    {},
          \t"runtime_link_state": {},
          }'''
          new = '''var safeTelemetryFields = map[string]struct{}{
          \t"browser_command":       {},
          \t"runtime_link_state":    {},
          \t"session_mode":          {},
          \t"session_runtime_state": {},
          }'''
          if source.count(old) != 1:
              raise SystemExit("safe telemetry allowlist anchor did not match exactly once")
          envelope.write_text(source.replace(old, new))

          sessions = Path("backend/internal/httpd/controllers/sessions.go")
          source = sessions.read_text()
          old = '''\t} else {
          \t\terr = c.Svc.Send(r.Context(), sessionID(r), message, attachment)
          \t}
          \tif err != nil {
          \t\tenvelope.WriteError(w, r, err)
          \t\treturn
          \t}'''
          new = '''\t} else {
          \t\terr = c.Svc.Send(r.Context(), sessionID(r), message, attachment)
          \t}
          \tif err != nil {
          \t\tcaptureSessionSendFailureContext(r, c.Svc, sessionID(r))
          \t\tenvelope.WriteError(w, r, err)
          \t\treturn
          \t}'''
          if source.count(old) != 1:
              raise SystemExit("session send error anchor did not match exactly once")
          sessions.write_text(source.replace(old, new))

          Path(".github/workflows/apply-5370-send-diagnostics.yml").unlink()
          PY
          gofmt -w \
            backend/internal/httpd/envelope/envelope.go \
            backend/internal/httpd/controllers/sessions.go \
            backend/internal/httpd/controllers/session_send_telemetry.go \
            backend/internal/httpd/controllers/session_send_telemetry_test.go
      - name: Run focused controller and telemetry tests
        working-directory: backend
        run: |
          go test ./internal/httpd/controllers -run 'TestSessionSendFailureCaptures'
          go test ./internal/httpd -run 'TestRequestLogger|TestHTTP'
      - name: Run owning package suites
        working-directory: backend
        run: go test ./internal/httpd/... 
      - name: Commit diagnostics and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/internal/httpd/envelope/envelope.go \
            backend/internal/httpd/controllers/sessions.go \
            backend/internal/httpd/controllers/session_send_telemetry.go \
            backend/internal/httpd/controllers/session_send_telemetry_test.go \
            .github/workflows/apply-5370-send-diagnostics.yml
          git commit -m "feat(http): add session context to failed send telemetry"
          git push origin HEAD:fix/5370-send-failure-session-diagnostics
