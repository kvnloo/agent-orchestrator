name: Apply 5954 effort round-trip fix

on:
  push:
    branches:
      - fix/5954-agent-config-effort-roundtrip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5954-agent-config-effort-roundtrip
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Add effort to the CLI project config mirror
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("backend/internal/cli/project.go")
          source = path.read_text()
          old = '''type agentConfig struct {
          \tModel       string `json:"model,omitempty"`
          \tMode        string `json:"mode,omitempty"`
          \tPermissions string `json:"permissions,omitempty"`
          }'''
          new = '''type agentConfig struct {
          \tModel       string `json:"model,omitempty"`
          \tEffort      string `json:"effort,omitempty"`
          \tMode        string `json:"mode,omitempty"`
          \tPermissions string `json:"permissions,omitempty"`
          }'''
          if source.count(old) != 1:
              raise SystemExit("agentConfig anchor did not match exactly once")
          path.write_text(source.replace(old, new))
          Path(".github/workflows/apply-5954-effort-roundtrip.yml").unlink()
          PY
          gofmt -w backend/internal/cli/project.go backend/internal/cli/project_effort_roundtrip_test.go
      - name: Run focused regression
        working-directory: backend
        run: go test ./internal/cli -run TestProjectConfigJSONRoundTripsAgentEffort
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/cli/project.go backend/internal/cli/project_effort_roundtrip_test.go .github/workflows/apply-5954-effort-roundtrip.yml
          git commit -m "fix(cli): preserve effort in project config JSON"
          git push origin HEAD:fix/5954-agent-config-effort-roundtrip
