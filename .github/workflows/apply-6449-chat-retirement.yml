name: Apply 6449 Chat replacement teardown fix

on:
  push:
    branches:
      - fix/6449-retire-chat-controller-before-replacement

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/6449-retire-chat-controller-before-replacement
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Stop the live controller before replacement teardown
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("backend/internal/session_manager/manager.go")
          source = path.read_text()
          old = '''\tif err := m.terminateNativeSession(ctx, rec); err != nil {
          \t\treturn fmt.Errorf("retire replacement %s: native session: %w", id, err)
          \t}'''
          new = '''\tif err := m.stopReplacementController(ctx, rec); err != nil {
          \t\treturn fmt.Errorf("retire replacement %s: controller: %w", id, err)
          \t}'''
          if source.count(old) != 2:
              raise SystemExit(f"replacement controller anchor count={source.count(old)}, want 2")
          path.write_text(source.replace(old, new))
          Path(".github/workflows/apply-6449-chat-retirement.yml").unlink()
          PY
          gofmt -w backend/internal/session_manager/manager.go backend/internal/session_manager/replacement_controller.go backend/internal/session_manager/retire_chat_replacement_test.go
      - name: Run focused replacement tests
        working-directory: backend
        run: go test ./internal/session_manager -run 'TestRetireForReplacementStopsChatController|TestRetireForReplacementDoesNotTerminateWhenChatControllerCannotStop'
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/session_manager/manager.go backend/internal/session_manager/replacement_controller.go backend/internal/session_manager/retire_chat_replacement_test.go .github/workflows/apply-6449-chat-retirement.yml
          git commit -m "fix(session): stop Chat controller before replacement"
          git push origin HEAD:fix/6449-retire-chat-controller-before-replacement
