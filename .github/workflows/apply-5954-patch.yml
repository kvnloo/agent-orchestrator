name: Apply 5954 CLI patch

on:
  push:
    branches:
      - fix/5954-cli-spawn-permission-effort

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5954-cli-spawn-permission-effort
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Apply narrow CLI fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          project = Path("backend/internal/cli/project.go")
          source = project.read_text()
          old = '''type agentConfig struct {
          \tModel       string `json:"model,omitempty"`
          \tMode        string `json:"mode,omitempty"`
          \tPermissions string `json:"permissions,omitempty"`
          }'''
          new = '''type agentConfig struct {
          \tModel       string `json:"model,omitempty"`
          \tEffort      string `json:"effort,omitempty"`
          \tMode        string `json:"mode,omitempty"`
          \tPermissions string `json:"permissions,omitempty"`
          }'''
          if source.count(old) != 1:
              raise SystemExit("agentConfig anchor did not match exactly once")
          project.write_text(source.replace(old, new))

          spawn = Path("backend/internal/cli/spawn.go")
          source = spawn.read_text()

          replacements = [
              ('''\tname            string
          \tmodel           string
          \tclaimPR         string''', '''\tname            string
          \tmodel           string
          \teffort          string
          \tpermission      string
          \tclaimPR         string'''),
              ('''\tModel           string `json:"model,omitempty"`
          \tDisplayName     string `json:"displayName"`''', '''\tModel           string `json:"model,omitempty"`
          \tEffort          string `json:"effort,omitempty"`
          \tPermissions     string `json:"permissions,omitempty"`
          \tDisplayName     string `json:"displayName"`'''),
              ('''\t\t\tif opts.kind != "" && opts.kind != "worker" && opts.kind != "orchestrator" {
          \t\t\t\treturn usageError{fmt.Errorf(`--kind must be "worker" or "orchestrator"`)}
          \t\t\t}
          \t\t\tif opts.standalone {''', '''\t\t\tif opts.kind != "" && opts.kind != "worker" && opts.kind != "orchestrator" {
          \t\t\t\treturn usageError{fmt.Errorf(`--kind must be "worker" or "orchestrator"`)}
          \t\t\t}
          \t\t\tswitch strings.TrimSpace(opts.permission) {
          \t\t\tcase "", "default", "accept-edits", "auto", "bypass-permissions":
          \t\t\tdefault:
          \t\t\t\treturn usageError{fmt.Errorf(`--permission must be "default", "accept-edits", "auto", or "bypass-permissions"`)}
          \t\t\t}
          \t\t\tif opts.standalone {'''),
              ('''\t\t\t\tModel:           strings.TrimSpace(opts.model),
          \t\t\t\tDisplayName:     name,''', '''\t\t\t\tModel:           strings.TrimSpace(opts.model),
          \t\t\t\tEffort:          strings.TrimSpace(opts.effort),
          \t\t\t\tPermissions:     strings.TrimSpace(opts.permission),
          \t\t\t\tDisplayName:     name,'''),
              ('''\tf.StringVar(&opts.model, "model", "", "Agent model override for this session only (e.g. sonnet, gpt-5.6-sol); overrides project/role config without changing it")
          \tf.StringVar(&opts.issue, "issue", "", "Issue id to associate with the session")''', '''\tf.StringVar(&opts.model, "model", "", "Agent model override for this session only (e.g. sonnet, gpt-5.6-sol); overrides project/role config without changing it")
          \tf.StringVar(&opts.effort, "effort", "", "Reasoning effort override for this session only; overrides project/role config without changing it")
          \tf.StringVar(&opts.permission, "permission", "", "Permission mode override for this session only: default, accept-edits, auto, or bypass-permissions")
          \tf.StringVar(&opts.issue, "issue", "", "Issue id to associate with the session")'''),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"spawn anchor did not match exactly once: {old[:60]!r}")
              source = source.replace(old, new)
          spawn.write_text(source)

          Path(".github/workflows/apply-5954-patch.yml").unlink()
          PY
          gofmt -w backend/internal/cli/project.go backend/internal/cli/spawn.go backend/internal/cli/spawn_permission_effort_test.go
      - name: Run focused CLI tests
        working-directory: backend
        run: go test ./internal/cli -run 'TestProjectAgentConfigRoundTripsEffort|TestSpawnForwardsPermissionAndEffortOverrides'
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/cli/project.go backend/internal/cli/spawn.go backend/internal/cli/spawn_permission_effort_test.go .github/workflows/apply-5954-patch.yml
          git commit -m "fix(cli): forward spawn permission and effort overrides"
          git push origin HEAD:fix/5954-cli-spawn-permission-effort
